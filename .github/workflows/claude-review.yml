name: Claude Review

# On-demand PR review by Claude, triggered by an "@claude review" comment.
# Paired with the /pr-review skill (`/pr-review claude`), which posts the
# trigger comment and then polls for claude[bot]'s inline review + summary.
#
# Prerequisites (one-time, per repo):
#   1. Authorize the Claude GitHub App on this repo (github.com app install,
#      or `/install-github-app` from Claude Code). This is a GitHub-side web
#      integration -- nothing is installed locally. It makes review comments
#      post as `claude[bot]`.
#   2. Add the repo secret CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # claude-code-action@v1 は OIDC トークンを取得するため id-token: write が必須。
  id-token: write
  # github_ci MCP サーバが workflow run 状態を読むために必要。
  actions: read

jobs:
  claude-review:
    # Cancel a superseded review on the same PR. Must be at job level (not
    # workflow level) so the `if` gate runs first — otherwise claude[bot]'s
    # own inline comments trigger a new run that kills the in-progress review.
    concurrency:
      group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # Only react to "@claude review" on a PR, and only from trusted authors.
    # inucon is PRIVATE, but keep the author_association gate as defence in depth.
    if: >
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
        github.event_name == 'pull_request_review_comment'
      ) &&
      contains(github.event.comment.body, '@claude review') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --allowedTools が無いと agent モードで github_inline_comment /
          # github_comment MCP サーバが導入されず、Claude はコメント投稿手段を持てない
          # ("No buffered inline comments" & サマリコメントも出ない) ので必須。
          #
          # allowlist は閉じている (ここに無い Bash prefix は既定で拒否) ため、
          # 実質これが CI 上の Claude の権限境界になる。したがって:
          # - `find` は入れない。`-exec` / `-delete` で disallowedTools の
          #   Edit/Write を迂回できてしまう。ファイル探索は read-only な
          #   組込み Glob / Grep で足りる。
          # - `gh api` は入れない。任意の POST が通ってしまう。
          # - `gh pr comment` だけは sentinel サマリ投稿に必要な write。
          #
          # --max-turns の実測: 50 では Task 6/7 の大きめ PR (#60 / #61) で
          # `Reached maximum number of turns (50)` に繰り返し到達し、手動
          # `@claude review` 再トリガが必要だった。sibling repo
          # nixos-config-private でも中規模 PR が 53 turns を要した
          # (run 35839011031)。余裕を見て 80 にする。cost は per-token でなく
          # seat allowance なので上げても実害はない。
          #
          # 注意: inline comment には github_inline_comment MCP サーバの
          # provision が必要で、それは open PR の review context がある場合
          # だけ。merged PR に trigger すると allowedTools に列挙していても
          # SDK options に mcpServers が入らず summary のみになる。CI の
          # 動作確認は必ず open PR で行う。
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 80
            --allowedTools "Read,Grep,Glob,WebFetch,WebSearch,Bash(grep:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git rev-parse:*),Bash(git branch:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,Agent"
          prompt: |
            You are reviewing this pull request for the INUCON project
            (TypeScript + Effect.ts, DDD / lightweight-hexagonal, pnpm workspace:
            portal / runner / shared). Design docs live under docs/superpowers/.
            This is a CI environment with restricted tool access.

            Available tools: Read, Grep, Glob, WebFetch, WebSearch,
            Bash (grep/cat/ls/head/tail/wc),
            Bash (git diff/log/show/status/rev-parse/branch),
            Bash (gh pr list/diff/view/comment),
            and mcp__github_inline_comment__create_inline_comment.
            Do NOT use Edit, Write, or Agent.
            If a tool call is denied, do NOT retry it or try workarounds — use
            only your allowed tools.

            Focus, in priority order, on:
              1. Correctness bugs, logic errors, and data-loss / destructive risks
                 (state-machine transitions, saga compensation, idempotency,
                 DB migrations, concurrency / TOCTOU).
              2. Security issues (injection, secret / token handling in logs and
                 errors, auth / authorization, unsafe shell, TLS).
              3. Effect.ts correctness (error channel typing, Layer wiring,
                 resource scoping) and high-value simplifications or reuse.
            Mention low-value style nits only when they materially help; prefer
            silence over noise.

            Post each concrete finding as an INLINE review comment on the exact
            line(s) it concerns, using the GitHub review tools available to you.

            When finished, post ONE summary comment on the PR that contains
            EXACTLY ONE of these sentinel lines, on its own line, verbatim:
              - If you found nothing worth raising:
                  CLAUDE_REVIEW: no issues found
              - Otherwise (you posted inline comments):
                  CLAUDE_REVIEW: <N> issue(s) -- see inline comments
            The sentinel line is REQUIRED: an automated loop reads it to know the
            review finished and whether there were findings. Do not omit it.
